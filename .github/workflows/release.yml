name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.423
          cache: true
          cache-dependency-path: |
            packages.lock.json
            ORhom.Tests/packages.lock.json

      - name: Validate release tag
        id: release-version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH: $tag"
          }
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "version=$($Matches.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Require tagged commit on main
        shell: pwsh
        run: |
          & git rev-parse --verify "refs/remotes/origin/main^{commit}"
          if ($LASTEXITCODE -ne 0) {
            throw "The origin/main reference is unavailable after the full checkout."
          }

          & git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tags must point to a commit that is already contained in main."
          }

      - name: Install and verify pinned Inno Setup compiler
        shell: pwsh
        run: |
          $installerPath = Join-Path $env:RUNNER_TEMP "innosetup-7.0.2-x64.exe"
          Invoke-WebRequest `
            -Uri "https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe" `
            -OutFile $installerPath
          $expectedInstallerSha256 = "5ad54ca3def786f8f4212552e54cc6d8d61329e2d24a1cfee0571d42c2684ff1"
          $actualInstallerSha256 =
            (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualInstallerSha256 -ne $expectedInstallerSha256) {
            throw "The downloaded Inno Setup compiler does not match the pinned SHA-256 checksum."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $installerPath
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Pyrsys B\.V\.(,|$)') {
            throw "The downloaded Inno Setup compiler does not have the expected valid signature."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "inno-setup-7"
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          $arguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/PORTABLE=1",
            "/CURRENTUSER",
            "/NOICONS",
            "/TASKS=`"`"",
            "/DIR=`"$installDir`""
          )
          $process = Start-Process `
            -FilePath $installerPath `
            -ArgumentList $arguments `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installation failed with exit code $($process.ExitCode)."
          }

          $compiler = Join-Path $installDir "ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "ISCC.exe was not found after installing the verified compiler."
          }
          "INNO_COMPILER=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download and verify Microsoft Visual C++ runtime
        shell: pwsh
        run: |
          $redistPath = Join-Path $env:RUNNER_TEMP "vc_redist.x64.exe"
          Invoke-WebRequest `
            -Uri "https://download.visualstudio.microsoft.com/download/pr/ebdab8e5-1d7b-4d9f-a11b-cbb1720c3b12/843068991DAAA1F73AD9F6239BCE4D0F6A07A51F18C37EA2A867E9BECA71295C/VC_redist.x64.exe" `
            -OutFile $redistPath
          $expectedRedistSha256 = "843068991daaa1f73ad9f6239bce4d0f6a07a51f18c37ea2a867e9beca71295c"
          $actualRedistSha256 =
            (Get-FileHash -LiteralPath $redistPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualRedistSha256 -ne $expectedRedistSha256) {
            throw "The downloaded Visual C++ runtime does not match the pinned SHA-256 checksum."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $redistPath
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid -or
              $signature.SignerCertificate.Subject -notmatch '(^|,\s*)CN=Microsoft Corporation(,|$)') {
            throw "The downloaded Visual C++ runtime does not have a valid Microsoft signature."
          }
          "VC_REDIST_PATH=$redistPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test, publish, and build installer
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\release-output"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          ./scripts/Build-WindowsRelease.ps1 `
            -Version $env:RELEASE_VERSION `
            -InnoCompilerPath $env:INNO_COMPILER `
            -VcRedistPath $env:VC_REDIST_PATH `
            -OutputDirectory $releaseDir

      - name: Smoke-test installer lifecycle
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\release-output"
          $installer = Join-Path $releaseDir "ORhom-Setup-$env:RELEASE_VERSION-win-x64.exe"
          $installDir = Join-Path $env:RUNNER_TEMP "orhom-installer-smoke"
          $installArguments = @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/TASKS=`"`"",
            "/DIR=`"$installDir`""
          )
          $installProcess = Start-Process `
            -FilePath $installer `
            -ArgumentList $installArguments `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($installProcess.ExitCode -ne 0) {
            throw "Silent installer smoke test failed with exit code $($installProcess.ExitCode)."
          }

          $installedExecutable = Join-Path $installDir "ORhom.exe"
          $installedNotices = Join-Path $installDir "THIRD-PARTY-NOTICES.md"
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf) -or
              -not (Test-Path -LiteralPath $installedNotices -PathType Leaf)) {
            throw "The installer smoke test did not install the expected application payload."
          }
          $installedVersion =
            [Diagnostics.FileVersionInfo]::GetVersionInfo($installedExecutable).ProductVersion
          if (-not $installedVersion.StartsWith(
              $env:RELEASE_VERSION,
              [StringComparison]::Ordinal)) {
            throw "The installed executable has an unexpected product version: $installedVersion"
          }

          $uninstallers = @(Get-ChildItem -LiteralPath $installDir -Filter "unins*.exe" -File)
          if ($uninstallers.Count -ne 1) {
            throw "The installer smoke test expected exactly one uninstaller."
          }
          $uninstallProcess = Start-Process `
            -FilePath $uninstallers[0].FullName `
            -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") `
            -Wait `
            -PassThru `
            -WindowStyle Hidden
          if ($uninstallProcess.ExitCode -ne 0) {
            throw "Silent uninstaller smoke test failed with exit code $($uninstallProcess.ExitCode)."
          }
          if ((Test-Path -LiteralPath $installedExecutable) -or
              (Test-Path -LiteralPath $installedNotices)) {
            throw "The uninstaller smoke test left application payload files behind."
          }

      - name: Attest release asset provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: artifacts/release-output/*

      - name: Upload verified release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: orhom-release-assets
          path: artifacts/release-output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: orhom-release-assets
          path: release-assets

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          $installer = Join-Path $releaseDir "ORhom-Setup-$version-win-x64.exe"
          $portable = Join-Path $releaseDir "ORhom-$version-win-x64-portable.exe"
          $notices = Join-Path $releaseDir "THIRD-PARTY-NOTICES.md"
          $checksums = Join-Path $releaseDir "SHA256SUMS.txt"
          $expectedAssets = @($installer, $portable, $notices, $checksums)
          $actualAssets = @(Get-ChildItem -LiteralPath $releaseDir -File)
          if ($actualAssets.Count -ne $expectedAssets.Count -or
              @($expectedAssets | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }).Count -ne 0) {
            throw "The downloaded release artifact does not contain exactly the expected four assets."
          }
          $expectedChecksumNames = @(
            [IO.Path]::GetFileName($installer),
            [IO.Path]::GetFileName($portable),
            [IO.Path]::GetFileName($notices)
          )
          $checksumLines = @(Get-Content -LiteralPath $checksums)
          if ($checksumLines.Count -ne $expectedChecksumNames.Count) {
            throw "SHA256SUMS.txt must contain exactly one entry for each release payload."
          }
          $seenChecksumNames =
            [Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
          foreach ($line in $checksumLines) {
            if ($line -notmatch '^(?<hash>[0-9a-f]{64}) \*(?<name>[^\\/]+)$') {
              throw "Invalid SHA256SUMS.txt line: $line"
            }
            $assetName = $Matches.name
            $expectedHash = $Matches.hash
            if ($expectedChecksumNames -cnotcontains $assetName -or
                -not $seenChecksumNames.Add($assetName)) {
              throw "SHA256SUMS.txt contains an unexpected or duplicate asset: $assetName"
            }
            $assetPath = Join-Path $releaseDir $assetName
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf) -or
                (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
              throw "Checksum validation failed for $assetName."
            }
          }
          $notes = @"
          ## Download

          Für die normale Installation unter Windows 11 x64 bitte **ORhom-Setup-$version-win-x64.exe** herunterladen und starten. Der Installer enthält die benötigte .NET-8-Laufzeit, installiert bei Bedarf die Microsoft-Visual-C++-Laufzeit und legt Startmenü- sowie optional Desktop-Verknüpfungen an.

          **ORhom-$version-win-x64-portable.exe** kopiert ORhom nicht in den Programme-Ordner. Auf dem Rechner muss dafür die aktuelle Microsoft Visual C++ v14 Redistributable (x64) bereits installiert sein; für einen neuen Rechner wird der Installer empfohlen.

          Beim ersten Start wird das geprüfte Whisper-Modell (ca. 1,6 GB) heruntergeladen. Für die lokale Transkription wird weiterhin ein aktueller Vulkan-fähiger Grafiktreiber benötigt.

          Der Build ist derzeit nicht mit einem kommerziellen Windows-Code-Signing-Zertifikat signiert; Windows kann deshalb einen SmartScreen-Hinweis anzeigen. Die SHA-256-Prüfsummen stehen in **SHA256SUMS.txt**.

          GitHub veröffentlicht für jedes Asset außerdem eine signierte Build-Provenienz. Sie lässt sich mit `gh attestation verify <Datei> --repo ${{ github.repository }}` prüfen.

          macOS und Linux werden von dieser Version noch nicht unterstützt.
          "@

          gh release create $tag `
            $installer `
            $portable `
            $notices `
            $checksums `
            --repo "${{ github.repository }}" `
            --verify-tag `
            --latest `
            --title "ORhom $version" `
            --notes $notes `
            --generate-notes
