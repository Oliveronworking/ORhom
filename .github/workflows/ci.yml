name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore OpenAIFlow.sln

      - name: Verify formatting
        run: dotnet format OpenAIFlow.sln --verify-no-changes --no-restore

      - name: Test release build
        run: dotnet test OpenAIFlow.sln -c Release --no-restore --nologo -p:TreatWarningsAsErrors=true

      - name: Verify self-contained Windows publish
        run: |
          dotnet publish ChatGptDictationBridge.csproj -c Release -r win-x64 --self-contained true --nologo -p:TreatWarningsAsErrors=true -p:PublishProfile=WindowsSelfContained -o artifacts/ci-publish
          if (-not (Test-Path -LiteralPath artifacts/ci-publish/OpenAIFlow.exe)) {
            throw "The expected OpenAIFlow.exe publish artifact is missing."
          }
          $publishFiles = @(Get-ChildItem -LiteralPath artifacts/ci-publish -File -Recurse)
          if ($publishFiles.Count -ne 1 -or $publishFiles[0].Name -ne "OpenAIFlow.exe") {
            throw "The installer requires a single-file publish containing only OpenAIFlow.exe."
          }
          if ($publishFiles[0].Length -le 0) {
            throw "The published OpenAIFlow.exe is empty."
          }
