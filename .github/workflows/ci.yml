name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.423
          cache: true
          cache-dependency-path: |
            packages.lock.json
            ORhom.Tests/packages.lock.json

      - name: Restore
        run: |
          dotnet restore ORhom.sln --locked-mode
          dotnet restore ORhom.csproj -r win-x64 --locked-mode

      - name: Verify formatting
        run: dotnet format ORhom.sln --verify-no-changes --no-restore

      - name: Test release build
        run: |
          dotnet test ORhom.Tests/ORhom.Tests.csproj -c Release --no-restore --nologo `
            --logger "trx;LogFileName=orhom-tests.trx" `
            --results-directory artifacts/test-results `
            --blame-hang `
            --blame-hang-timeout 5m `
            -p:TreatWarningsAsErrors=true `
            -p:TreatNoTestsAsError=true

      - name: Verify self-contained Windows publish
        run: |
          dotnet publish ORhom.csproj -c Release -r win-x64 --self-contained true --no-restore --nologo -p:TreatWarningsAsErrors=true -p:PublishProfile=WindowsSelfContained -o artifacts/ci-publish
          if (-not (Test-Path -LiteralPath artifacts/ci-publish/ORhom.exe)) {
            throw "The expected ORhom.exe publish artifact is missing."
          }
          $publishFiles = @(Get-ChildItem -LiteralPath artifacts/ci-publish -File -Recurse)
          if ($publishFiles.Count -ne 1 -or $publishFiles[0].Name -ne "ORhom.exe") {
            throw "The portable release requires a single-file publish containing only ORhom.exe."
          }
          $publishedExe = $publishFiles[0]
          if ($publishedExe.Length -le 0) {
            throw "The published ORhom.exe is empty."
          }
          $versionInfo = [Diagnostics.FileVersionInfo]::GetVersionInfo($publishedExe.FullName)
          if ($versionInfo.ProductName -ne "ORhom" -or $versionInfo.FileDescription -ne "ORhom") {
            throw "The published executable metadata must use ORhom for ProductName and FileDescription."
          }

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orhom-test-results
          path: artifacts/test-results/
          if-no-files-found: warn
          retention-days: 7
